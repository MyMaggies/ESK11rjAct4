      drawers: [{ id: "ideas", label: st.side.title, title: st.side.title, html: () => ideas(st.side.items) }],
    };
  },
  extract(st) {
    const phr = {}, rng = {}, stg = {};
    st.notes.forEach((n) => {
      if (n.phrase) { if (n.stage) (stg[n.stage] = stg[n.stage] || []).push(n); else (phr[n.at] = phr[n.at] || []).push(n); }
      else for (let i = n.from; i <= n.to; i++) rng[i] = n;
    });
    const glossHTML = (l) => S.gloss && l.g ? `<div class="gl"><span class="glab">Plain English</span>${esc(l.g)}</div>` : "";
    const body = st.lines.map((l) => {
      if (l.k === "sp") return `<div class="sp">${esc(l.t)}</div>`;
      if (l.k === "gap") return `<div class="gapline">${fmt(l.t)}</div>`;
      if (l.k === "st") return `<div class="stg">${l.key && stg[l.key] ? annSpans(l.t, stg[l.key]) : fmt(l.t)}</div>`;
      const r = rng[l.n];
      const num = l.n % 5 === 0 ? l.n : "";
      if (r) return `<div class="ln rng${match(r) ? "" : " dim"}" data-note="${r.id}" role="button" tabindex="0"><span class="num">${num}</span><span class="tx">${fmt(l.t)}</span>${glossHTML(l)}</div>`;
      return `<div class="ln"><span class="num">${num}</span><span class="tx">${annSpans(l.t, phr[l.n] || [])}</span>${glossHTML(l)}</div>`;
    }).join("");
    return {
      kick: `${st.label} · about ${st.mins} min`, title: st.title, sub: st.sub, rail: "Extract", focus: true,
      actions: `<button class="tb${S.gloss ? " on" : ""}" data-act="glosstoggle" aria-pressed="${S.gloss}">Plain English ${S.gloss ? "on" : "off"}</button>`,
      body: `<div class="lines${S.gloss ? "" : " noglo"}">${body}</div><div class="foot">Tap an underlined phrase or highlighted line to open its note. The small grey line under each passage is a plain-English paraphrase to help you read independently — the highlighted notes are the ones that matter most for themes and exam questions. Text: Folger Shakespeare Library edition (folger.edu). Line numbers as printed there.</div>`,
      drawers: [
        { id: "scene", label: "Before you read", title: "Before you read", cta: !!st.think, html: () => scenePanel(st) },
        { id: "note", label: () => `Notes (${visible(st).length})` },
      ],
    };
  },
  link(st) {
    const { html, bank } = clozeParts(st.text);
    const drawers = [];
    if (st.hinge) drawers.push({ id: "hinge", label: "Quick check", cta: true, title: "Quick check", html: () => hingeHTML(st.hinge) });
    if (st.ext) drawers.push({ id: "ext", label: "Stretch", title: "Stretch", html: () => `<p class="stretchsc"><b>Stretch:</b> ${esc(st.ext)}</p>` });
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Read aloud and tap each gap to reveal the word.", rail: "Gap-fill",
      actions: `<button class="tb" data-act="reveal">Reveal all</button>`,
      body: `<div class="inner"><div class="lab">Word bank</div><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div><p class="cloze">${html}</p></div>`,
      drawers,
    };
  },
  plenary(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Answer on your handout first. Then tap a question to check.", rail: "Exit ticket",
      body: `<div class="inner">${qaCards(st.ticket)}</div>`,
      drawers: [
        { id: "rate", label: "Rate yourself", cta: true, title: "Rate yourself", html: () => `<p class="hint">How well can you do each of today’s success criteria?</p><div id="ratings">${ratingHTML(S.h)}</div>` },
        { id: "next", label: "What’s next", title: "What’s next", html: () => `<div class="track"><p>${esc(st.next)}</p></div>` },
      ],
    };
  },
  practice(st) {
    const kind = { mc: "Multiple choice", tf: "True or false", match: "Matching", short: "Write your answer" };
    const cards = st.qs.map((q) => {
      let body = `<div class="qq">${esc(q.q)}</div>`;
      if (q.k === "mc") body += `<ol class="opts opts-a">${q.opts.map((o) => `<li>${esc(o)}</li>`).join("")}</ol>`;
      if (q.k === "tf") body += `<ul class="opts">${q.items.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`;
      if (q.k === "match") body += `<div class="mt"><ul>${q.left.map((o) => `<li>${esc(o)}</li>`).join("")}</ul><ul>${q.right.map((o) => `<li>${esc(o)}</li>`).join("")}</ul></div>`;
      const ms = q.ms ? `<ul class="ms">${q.ms.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : "";
      return `<div class="qa" role="button" tabindex="0" data-qa><span class="lv">${kind[q.k]} · ${q.marks} mark${q.marks > 1 ? "s" : ""}</span>${body}<div class="aa">${esc(q.a)}${ms}</div></div>`;
    }).join("");
    const mins = Math.round((st.timer || 300) / 60);
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Questions",
      actions: `<button class="tb" data-act="timer" data-sec="${st.timer || 300}">${mins}-minute timer</button>`,
      body: `<div class="inner">${cards}</div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
  assess(st) {
    return { raw: `<section class="pane wide assess"><h2>${esc(st.title)}</h2><p class="sub">${esc(st.sub || "")}</p>` +
      `<div class="row">${st.presets.map((m) => `<button class="ghost primary big" data-act="timer" data-sec="${m * 60}">Start ${m} minutes</button>`).join("")}<button class="ghost big" data-act="tstop">Stop timer</button></div></section>`, drawers: [] };
  },
  spot(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Spot the irony",
      body: `<div class="inner">` + st.items.map((it, i) => `<div class="spotitem" role="button" tabindex="0" data-spot="${i}"><p class="sq">${esc(it.t)}</p><p class="sw" hidden>${esc(it.why)}</p></div>`).join("") +
        `<div class="row"><button class="ghost primary" data-act="spotcheck">Check my answers</button><button class="ghost" data-act="spotreset">Start again</button></div><p class="score" id="spotscore"></p></div>`,
      drawers: [{ id: "tips", label: st.tipsTitle, title: st.tipsTitle, html: () => ideas(st.tips) }],
    };
  },
  battle(st) {
    const B = S.battle, R = st.rounds, done = B.r >= R.length;
    let body;
    if (done) {
      body = `<div class="bcard"><p class="score">${B.meter >= 100 ? "Macbeth is settled." : "Macbeth is nearly convinced."}</p><p class="hres">${esc(st.end)}</p><button class="ghost primary" data-act="brestart">Play again</button></div>`;
    } else {
      const rd = R[B.r], p = B.picked;
      body = `<div class="bcard"><span class="lab">Round ${B.r + 1} of ${R.length}: Macbeth says</span><p class="q">${esc(rd.doubt)}</p><span class="lab">Lady Macbeth: choose your tactic</span>` +
        rd.opts.map((o, i) => `<button class="opt${p !== null ? (o.best ? " right" : i === p ? " wrong" : "") : ""}" data-bopt="${i}" ${p !== null ? "disabled" : ""}>${String.fromCharCode(65 + i)}&nbsp; ${esc(o.t)}</button>`).join("") +
        (p !== null ? `<p class="hres"><b>${rd.opts[p].best ? "Strong choice." : "Not quite."}</b> ${esc(rd.opts[p].why)}</p><button class="ghost primary" data-act="bnext">${B.r + 1 === R.length ? "See the result" : "Next round"}</button>` : "") + `</div>`;
    }
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: st.sub, rail: "Battle",
      headExtra: `<div class="mhead"><span>Macbeth’s resolve</span><div class="meter" role="img" aria-label="Macbeth’s resolve ${B.meter} percent"><div class="bar" style="width:${B.meter}%"></div></div><b>${B.meter}%</b></div>`,
      body: `<div class="inner">${body}</div>`,
      drawers: [{ id: "quote", label: "Use a quotation", title: "Use a quotation", html: () => `<div class="idea"><b>Use a quotation</b><p>Every strong tactic comes from a line in Scene 7. Say which line you would quote.</p></div><p class="hint">At 100% Macbeth is ready to go through with it.</p>` }],
    };
  },
};

/* ---------- putting a step on screen ---------- */
function mainMarkup(v) {
  if (v.raw) return v.raw;
  const btns = v.drawers.map((d) => `<button class="tb${d.cta ? " cta" : ""}" data-drawer="${d.id}" aria-pressed="false">${esc(typeof d.label === "function" ? d.label() : d.label)}</button>`).join("");
  const focus = v.focus ? `<button class="tb" data-act="focus" title="Show only the extract (F)"><i class="ic ic-focus"></i>Focus</button>` : "";
  return `<section class="pane main" id="mainpane"><div class="phead"><div class="pt"><span class="kick">${esc(v.kick)}</span><h2>${esc(v.title)}</h2>${v.sub ? `<p class="sub">${esc(v.sub)}</p>` : ""}</div>` +
    `<div class="ptools">${btns}${v.actions || ""}${focus}</div>${v.headExtra || ""}</div><div class="pbody" id="script">${v.body}</div></section>`;
}
const drawerMarkup = () =>
  `<aside class="pane drawer" id="drawer" hidden aria-label="Side panel"><div class="dhead"><h3 id="dtitle"></h3><div class="dtools">` +
  `<button class="tb" data-act="dwide" title="Make this panel wider or narrower"><i class="ic ic-wide"></i><span id="lw">Wider</span></button>` +
  `<button class="tb" data-act="dfull" title="Hide the main pane to use the full width"><i class="ic ic-full"></i><span id="lf">Hide</span></button>` +
  `<button class="ib" data-act="dclose" aria-label="Close" title="Close (Esc)"><i class="ic ic-close"></i></button></div></div><div class="dbody" id="panel" aria-live="polite"></div></aside>` +
  `<button class="railtab" id="mainrail" data-act="showmain" hidden></button>`;

function mount(keep) {
  const el = $("#stage");
  if (S.view === "revise") { el.innerHTML = reviseHTML(); S.drawer = null; layout(); el.firstElementChild.scrollTop = 0; return; }
  const st = cur();
  const v = VIEW[st.type](st);
  DR = {}; v.drawers.forEach((d) => (DR[d.id] = d));
  const keepTop = keep && $("#script") ? $("#script").scrollTop : 0;
  if (!keep) { S.drawer = null; S.wide = false; S.mainHidden = false; S.sel = null; }
  el.innerHTML = mainMarkup(v) + drawerMarkup();
  S.rail = (v.rail || "main pane").toLowerCase();
  const rail = $("#mainrail"); if (rail) rail.textContent = "Show " + S.rail;
  if (S.drawer && S.drawer !== "note" && !DR[S.drawer]) S.drawer = null;
  if (S.drawer === "note" && !S.sel) S.drawer = null;
  layout();
  if (S.sel) markSel();
  const sc = $("#script"); if (sc) sc.scrollTop = keepTop;
}
function markSel() { document.querySelectorAll("[data-note]").forEach((el) => el.classList.toggle("on", el.dataset.note === S.sel)); }
function layout() {
  const c = $("#stage"), d = $("#drawer");
  const has = !!S.drawer && !!d;
  c.classList.toggle("has-drawer", has);
  c.classList.toggle("wide", has && S.wide);
  c.classList.toggle("mainhidden", has && S.mainHidden);
  if (d) d.hidden = !has;
  const rail = $("#mainrail"); if (rail) rail.hidden = !(has && S.mainHidden);
  document.querySelectorAll(".tb[data-drawer]").forEach((b) => { const on = b.dataset.drawer === S.drawer; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  if (has) { fillDrawer(); $("#lw").textContent = S.wide ? "Narrower" : "Wider"; $("#lf").textContent = (S.mainHidden ? "Show " : "Hide ") + S.rail; }
}
function fillDrawer() {
  const st = cur();
  let title, html;
  if (S.drawer === "note") {
    const n = S.sel && byId(st, S.sel);
    if (!n) { closeDrawer(); return; }
    title = "Notes"; html = notePanel(st, n);
  } else { const dd = DR[S.drawer]; title = dd.title || (typeof dd.label === "string" ? dd.label : ""); html = dd.html(); }
  $("#dtitle").textContent = title;
  $("#panel").innerHTML = html;
  $("#panel").scrollTop = 0;
}
function openDrawer(id) { S.drawer = id; layout(); }
function closeDrawer() {
  if (S.drawer === "note") S.sel = null;
  S.drawer = null; S.wide = false; S.mainHidden = false; markSel(); layout();
}
function select(id) {
  S.sel = id; S.drawer = "note"; markSel(); layout();
  const first = document.querySelector(`[data-note="${id}"]`);
  if (first) setTimeout(() => first.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" }), 40);
}
function stepNote(d) {
  const st = cur(), vis = visible(st);
  if (!vis.length) return;
  let i = vis.findIndex((n) => n.id === S.sel);
  i = i < 0 ? (d > 0 ? 0 : vis.length - 1) : (i + d + vis.length) % vis.length;
  select(vis[i].id);
}
function setFocus(on) {
  if (on && (S.view !== "lesson" || cur().type !== "extract")) return;
  S.focus = on;
  document.body.classList.toggle("focus", on);
  $("#fctl").setAttribute("aria-hidden", String(!on));
  if (on) setTimeout(() => $("#unfocus").focus({ preventScroll: true }), 400);
  const sc = $("#script"); if (sc && on) sc.scrollTop = sc.scrollTop;
}

/* ---------- spot the irony ---------- */
function spotCheck() {
  const st = cur(), total = st.items.filter((i) => i.irony).length;
  let hit = 0, wrong = 0;
  document.querySelectorAll(".spotitem").forEach((el) => {
    const it = st.items[+el.dataset.spot], picked = el.classList.contains("picked");
    el.classList.remove("ok", "bad", "miss", "none");
    if (picked && it.irony) { el.classList.add("ok"); hit++; }
    else if (picked) { el.classList.add("bad"); wrong++; }
    else if (it.irony) el.classList.add("miss");
    else el.classList.add("none");
    el.querySelector(".sw").hidden = false;
  });
  $("#spotscore").textContent = `You found ${hit} of ${total} ironic lines` + (wrong ? ` and picked ${wrong} that ${wrong === 1 ? "is" : "are"} not dramatic irony.` : ".");
}

/* ---------- revise mode (for home) ---------- */
function reviseNotes() {
  const out = [];
  DATA.hours.forEach((h) => h.steps.filter((s) => s.type === "extract").forEach((st) => st.notes.filter((n) => n.revise).forEach((n) => out.push({ st, n }))));
  return out;
}
function refText(st, n) {
  const ln = n.at !== undefined ? `line ${n.at}` : n.from !== undefined ? (n.from === n.to ? `line ${n.from}` : `lines ${n.from}–${n.to}`) : "";
  return `Act ${st.scene.split(".")[0]} Scene ${st.scene.split(".")[1]}${ln ? ", " + ln : ""}`;
}
function reviseHTML() {
  const tabs = [["quotes", "Key quotes"], ["quiz", "Quick quiz"], ["gaps", "Gap-fills"], ["ready", "Am I ready?"]];
  const head = `<div class="head"><h2>Revise Act 4</h2><p class="intro">Try to answer before you reveal. Nothing here is marked, so mistakes are useful.</p></div>` ;
  let body = "";
  if (S.rev.tab === "quotes") {
    const all = reviseNotes();
    const cards = all.filter(({ n }) => tagOK(n, S.rev.tag));
    body = `<p class="intro">Read the quotation. Say what it shows about the character or the theme. Then tap to check.</p>` +
      `<div class="qgrid">${cards.map(({ st, n }) => `<div class="qcard" role="button" tabindex="0" data-qcard><p class="qt">${fmt(quoteOf(st, n))}</p><p class="qr">${esc(refText(st, n))}</p>` +
        `<div class="qb"><p><b>${esc(n.title)}.</b> ${esc(n.meaning)}</p><p>${esc(n.effect)}</p>${n.support ? `<p><b>Sentence starter:</b> ${esc(n.support)}</p>` : ""}${n.stretch ? `<p><b>Stretch:</b> ${esc(n.stretch)}</p>` : ""}` +
        `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div></div></div>`).join("")}</div>`;
  } else if (S.rev.tab === "quiz") {
    body = quizHTML();
  } else if (S.rev.tab === "gaps") {
    let n = 0;
    DATA.hours.forEach((h) => { let last = null; h.steps.forEach((st) => {
      if (st.type === "extract") last = st;
      if (st.type === "link") {
        n++;
        const { html, bank } = clozeParts(st.text);
        body += `<div class="gapcard"><h3>${esc(h.title)}: after ${esc(last ? last.title : "the start")}</h3><p class="cloze">${html}</p><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div>` +
          (st.ext ? `<p class="stretchsc"><b>Stretch:</b> ${esc(st.ext)}</p>` : "") + `<div class="row"><button class="ghost small" data-act="revealcard">Reveal all</button></div></div>`;
      }
    }); });
    body = `<p class="intro">Fill the gaps in your head or on paper. Then tap a gap to check it.</p>` + body;
  } else {
    body = `<p class="intro">Rate yourself against each success criterion. Your choices stay on this device only.</p>` +
      DATA.hours.map((h, i) => `<div class="gapcard"><h3>${esc(h.title)}</h3><p>${esc(h.aims.li)}</p><div id="ratings-${i}" class="ratings-h">${ratingHTML(i)}</div></div>`).join("");
  }
  return `<section class="pane wide revise" id="script">${head}${body}</section>`;
}
function quizHTML() {
  const Q = DATA.QUIZ;
  let z = S.rev.quiz;
  if (!z) return `<div class="qz"><h3>Quick quiz</h3><p class="intro">${Q.length} questions on Act 4, Scenes 1 to 5. Pick an answer to see why.</p><button class="ghost primary" data-act="qstart">Start the quiz</button></div>`;
  if (z.done) return `<div class="qz"><h3>Finished</h3><p class="score">${z.score} out of ${Q.length}</p><p class="intro">${z.score === Q.length ? "Every question right. Try the stretch questions in Key quotes." : "Go back to Key quotes or Gap-fills for anything that surprised you, then try again."}</p><button class="ghost primary" data-act="qstart">Try again</button></div>`;
  const q = Q[z.order[z.i]];
  return `<div class="qz"><span class="qn">Question ${z.i + 1} of ${Q.length}</span><h3>${esc(q.q)}</h3>` +
    q.opts.map((o, i) => `<button class="opt${z.picked !== null ? (i === q.correct ? " right" : i === z.picked ? " wrong" : "") : ""}" data-qopt="${i}" ${z.picked !== null ? "disabled" : ""}>${"ABCD"[i]}&nbsp; ${esc(o)}</button>`).join("") +
    (z.picked !== null ? `<p class="why"><b>${z.picked === q.correct ? "Correct." : "Not quite."}</b> ${esc(q.why)}</p><button class="ghost primary" data-act="qnext">${z.i + 1 === Q.length ? "See my score" : "Next question"}</button>` : "") + `</div>`;
}
function qstart() {
  const order = DATA.QUIZ.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  S.rev.quiz = { order, i: 0, score: 0, picked: null, done: false };
}

/* ---------- navigation ---------- */
function renderAll() { renderTop(); renderNav(); renderFilters(); mount(false); }
function go(h, s) {
  if (S.focus) setFocus(false);
  S.view = "lesson"; S.h = h; S.s = s; S.sel = null; S.battle = { r: 0, meter: 20, picked: null };
  renderAll();
}
function move(d) {
  let h = S.h, s = S.s + d;
  if (s < 0) { if (h === 0) return; h--; s = DATA.hours[h].steps.length - 1; }
  else if (s >= DATA.hours[h].steps.length) { if (h === DATA.hours.length - 1) return; h++; s = 0; }
  go(h, s);
}
function showRevise() { if (S.focus) setFocus(false); S.view = "revise"; renderTop(); renderNav(); renderFilters(); mount(false); }

/* ---------- timer ---------- */
const T = { id: null, end: 0 };
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function timerStart(sec) {
  clearInterval(T.id);
  const el = $("#timer"); el.hidden = false; el.classList.remove("done");
  T.end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
    $("#tt").textContent = left > 0 ? mmss(left) : "Time!";
    if (left <= 0) { clearInterval(T.id); el.classList.add("done"); }
  };
  tick(); T.id = setInterval(tick, 250);
}
function timerStop() { clearInterval(T.id); $("#timer").hidden = true; }

/* ---------- events ---------- */
function syncReveal(scope) {
  const btn = (scope || document).querySelector('[data-act="reveal"],[data-act="revealcard"]');
  if (!btn) return;
  const gaps = [...(scope || document).querySelectorAll(".gap")];
  btn.textContent = gaps.length && gaps.every((g) => g.classList.contains("open")) ? "Hide all" : "Reveal all";
}
function hingeMark(box, hg, picked) {
  box.querySelectorAll(".opt").forEach((o, j) => { o.classList.toggle("right", j === hg.correct); o.classList.toggle("wrong", picked !== null && j === picked && j !== hg.correct); });
  const res = box.querySelector(".hres"); res.hidden = false;
  res.innerHTML = `<b>${picked === null ? "Answer:" : picked === hg.correct ? "Correct." : "Not quite."}</b> ${esc(hg.why)}`;
}
function hidePops() {
  document.querySelectorAll(".pop").forEach((p) => { p.hidden = true; const b = p.parentElement.querySelector("button[aria-haspopup]"); if (b) b.setAttribute("aria-expanded", "false"); });
}
document.addEventListener("click", (e) => {
  const t = e.target;
  const pb = t.closest("button[aria-haspopup]");
  if (pb) {
    const p = pb.parentElement.querySelector(".pop"), wasHidden = p.hidden;
    hidePops(); p.hidden = !wasHidden; pb.setAttribute("aria-expanded", String(wasHidden));
    return;
  }
  if (!t.closest(".pop")) hidePops();
  const dr = t.closest("[data-drawer]");
  if (dr) {
    const id = dr.dataset.drawer;
    if (S.drawer === id) closeDrawer();
    else if (id === "note") { if (S.sel && visible(cur()).some((n) => n.id === S.sel)) select(S.sel); else stepNote(1); }
    else { if (S.drawer === "note") S.sel = null; markSel(); openDrawer(id); }
    return;
  }
  const note = t.closest("[data-note]");
  if (note) { select(note.dataset.note); return; }
  const gap = t.closest("[data-gap]");
  if (gap) { gap.classList.toggle("open"); syncReveal(gap.closest(".gapcard") || document); return; }
  const qa = t.closest("[data-qa]");
  if (qa) { qa.classList.toggle("open"); return; }
  const fact = t.closest("[data-reveal]");
  if (fact) { fact.classList.toggle("open"); return; }
  const sp = t.closest("[data-spot]");
  if (sp) { if (!/\b(ok|bad|miss|none)\b/.test(sp.className)) sp.classList.toggle("picked"); return; }
  const bo = t.closest("[data-bopt]");
  if (bo) {
    const B = S.battle, rd = cur().rounds[B.r];
    if (B.picked === null) { B.picked = +bo.dataset.bopt; B.meter = Math.min(100, B.meter + rd.opts[B.picked].pts); mount(true); }
    return;
  }
  const qc = t.closest("[data-qcard]");
  if (qc) { qc.classList.toggle("open"); return; }
  const hb = t.closest("[data-hinge]");
  if (hb) { hingeMark(hb.closest(".hinge"), cur().hinge, +hb.dataset.hinge); return; }
  const rate = t.closest("[data-rate]");
  if (rate) {
    const [h, i, v] = rate.dataset.rate.split(":");
    S.rate[h + ":" + i] = +v; saveRate();
    const box = rate.closest("#ratings, .ratings-h");
    if (box) box.innerHTML = ratingHTML(+h);
    return;
  }
  const qo = t.closest("[data-qopt]");
  if (qo) {
    const z = S.rev.quiz, q = DATA.QUIZ[z.order[z.i]];
    if (z.picked === null) { z.picked = +qo.dataset.qopt; if (z.picked === q.correct) z.score++; $("#stage").innerHTML = reviseHTML(); }
    return;
  }
  const b = t.closest("button");
  if (!b) return;
  if (b.closest("#tmenu")) { timerStart(+b.dataset.sec); hidePops(); return; }
  if (b.dataset.view === "revise") { hidePops(); showRevise(); return; }
  if (b.dataset.h !== undefined) { hidePops(); return go(+b.dataset.h, 0); }
  if (b.dataset.s !== undefined) return go(S.h, +b.dataset.s);
  if (b.dataset.tab) { S.rev.tab = b.dataset.tab; renderNav(); renderFilters(); $("#stage").innerHTML = reviseHTML(); return; }
  if (b.dataset.tag !== undefined) {
    if (S.view === "revise") { S.rev.tag = b.dataset.tag; renderFilters(); $("#stage").innerHTML = reviseHTML(); return; }
    S.tag = b.dataset.tag;
    const st = cur();
    if (S.sel && !match(byId(st, S.sel))) { S.sel = null; if (S.drawer === "note") S.drawer = null; }
    renderFilters(); mount(true);
    return;
  }
  switch (b.dataset.act) {
    case "next": move(1); break;
    case "prev": move(-1); break;
    case "nn": stepNote(1); break;
    case "pn": stepNote(-1); break;
    case "firstnote": stepNote(1); break;
    case "dclose": closeDrawer(); break;
    case "dwide": S.wide = !S.wide; S.mainHidden = false; layout(); break;
    case "dfull": S.mainHidden = !S.mainHidden; layout(); break;
    case "showmain": S.mainHidden = false; layout(); break;
    case "focus": setFocus(true); break;
    case "glosstoggle": S.gloss = !S.gloss; mount(true); break;
    case "unfocus": setFocus(false); break;
    case "tog": { const el = $("#panel ." + b.dataset.t); if (el) { el.hidden = !el.hidden; if (!el.hidden) el.scrollIntoView({ block: "nearest" }); } break; }
    case "timer": timerStart(+b.dataset.sec); break;
    case "spotcheck": spotCheck(); break;
    case "spotreset": mount(true); break;
    case "bnext": S.battle.r++; S.battle.picked = null; mount(true); break;
    case "brestart": S.battle = { r: 0, meter: 20, picked: null }; mount(true); break;
    case "tstop": timerStop(); break;
    case "hingeshow": hingeMark(b.closest(".hinge"), cur().hinge, null); break;
    case "qstart": qstart(); $("#stage").innerHTML = reviseHTML(); break;
    case "qnext": { const z = S.rev.quiz; z.i++; z.picked = null; if (z.i >= DATA.QUIZ.length) z.done = true; $("#stage").innerHTML = reviseHTML(); break; }
    case "reveal": case "revealcard": {
      const scope = b.closest(".gapcard") || document;
      const gaps = scope.querySelectorAll(".gap");
      const allOpen = [...gaps].every((g) => g.classList.contains("open"));
      gaps.forEach((g) => g.classList.toggle("open", !allOpen));
      syncReveal(scope);
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if ((e.key === "Enter" || e.key === " ") && tg.matches("[role=button]")) { e.preventDefault(); tg.click(); return; }
  if (tg.matches("input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape") {
    if ([...document.querySelectorAll(".pop")].some((p) => !p.hidden)) hidePops();
    else if (S.focus) setFocus(false);
    else if (S.drawer) closeDrawer();
    return;
  }
  if (S.view !== "lesson") return;
  if (e.key === "f" || e.key === "F") { setFocus(!S.focus); return; }
  if (S.focus) return;
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "]") stepNote(1);
  else if (e.key === "[") stepNote(-1);
});

/* tools */
function setScale(d) {
  S.scale = Math.min(1.6, Math.max(0.75, +(S.scale + d).toFixed(2)));
  document.documentElement.style.setProperty("--scale", S.scale);
}
["#fsm", "#ffm"].forEach((id) => $(id).addEventListener("click", () => setScale(-0.1)));
["#fsp", "#ffp"].forEach((id) => $(id).addEventListener("click", () => setScale(0.1)));
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function syncTheme() { $("#theme").textContent = effectiveTheme() === "dark" ? "Day mode" : "Night mode"; }
$("#theme").addEventListener("click", () => { document.documentElement.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark"; syncTheme(); });
$("#full").addEventListener("click", () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) { /* not available */ }
});
syncTheme();
renderAll();

</script>
</body>
</html>
